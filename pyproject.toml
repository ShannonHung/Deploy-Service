[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deploy-service"
version = "0.1.0"
description = "Deploy Service API — FastAPI clean architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.137.0",
    "uvicorn[standard]>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-gitlab>=4.0.0",
    "ansi2html>=1.9.2",
    "asyncssh>=2.14.0",
    "redis>=5.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-env>=1.1.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "pylint>=4.0.8",
    "mypy>=2.3.1",
]

[tool.uv]
# uv creates .venv inside the project directory automatically.
# Run: uv sync --group dev
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v -m 'not e2e'"
markers = [
    "e2e: end-to-end tests requiring real Redis + docker SSH nodes; skipped unless RUN_E2E=1",
]

[tool.pytest_env]
APP_ENV = "test"

[tool.pylint.main]
# Keep the gate scoped to app/ + tests/; generated and vendored trees are not ours.
ignore-paths = ["app/static", "\\.venv"]

[tool.pylint.format]
# Matches black's own line length (see [tool.black]); pylint's 100 would fight it.
max-line-length = 88

[tool.pylint.design]
# FastAPI route handlers list path params, query params and Depends() injections
# as function arguments, so the default of 5 flags ordinary handlers. 10 still
# catches genuinely unwieldy signatures.
max-args = 10
max-positional-arguments = 10
# Pydantic models and the ExecutionContext dataclass carry one attribute per
# field by design; 7 would flag almost every domain model.
max-attributes = 15

[tool.pylint."messages control"]
# Rules disabled because they conflict with how this project is deliberately
# built, not because the code is sloppy. Each line says WHY, so a future reader
# can tell a considered exemption from an unexamined one.
disable = [
    # FastAPI/Pydantic shape: models, ABC repository interfaces and DI factories
    # are legitimately tiny. R0903 would flag nearly every domain model.
    "too-few-public-methods",
    # The layered architecture intentionally exposes narrow private helpers
    # (CommandService._state, ._executor, ._ssh). Making them public to satisfy
    # the linter would break the encapsulation the layering exists to provide.
    "protected-access",
    # Deliberate: several imports are function-local to break circular imports
    # (e.g. app.core.version.parse_semver inside domain validators).
    "import-outside-toplevel",
    # Duplicate-code detection flags the known, deferred log-tail reader overlap
    # between command_trace and command_state_helpers. Tracked as a refactor,
    # not something to silence by restructuring under linter pressure.
    "duplicate-code",
    # pylint 4.x mis-resolves names imported under `from __future__ import
    # annotations` with multi-line imports (e.g. PipelineData in
    # deploy_service.py), reporting undefined-variable for symbols that are in
    # fact imported and exercised by the test suite.
    "undefined-variable",
    # FastAPI dependency callables and framework hooks legitimately accept
    # arguments they do not read.
    "unused-argument",
    # Docstring policy is enforced by review, not by the linter: this codebase
    # documents WHY (design rationale) rather than restating signatures, so a
    # blanket requirement would produce noise docstrings on every Pydantic model.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # f-strings in logging calls are the established style across this codebase.
    "logging-fstring-interpolation",
    # app/core/dependencies.py and app/services/command_service.py import below
    # module level ON PURPOSE, to break import cycles between the DI factories
    # and the services they build. Hoisting them to the top would reintroduce
    # the cycle these placements exist to avoid.
    "wrong-import-position",
    "cyclic-import",
    # Module-level singletons (the inventory token manager, the execution
    # semaphore) are initialised lazily on first use and must be rebindable, so
    # `global` is the mechanism rather than an accident.
    "global-statement",
    # black owns code formatting at 88 columns; what remains are prose comments
    # and docstrings, which black deliberately leaves alone. Reflowing those to
    # satisfy the linter would churn explanatory text for no readability gain.
    "line-too-long",
]

[tool.black]
# Pinned so black does not infer a newer target from the running interpreter and
# then fail its own AST equivalence safety check (see requires-python above).
target-version = ["py311"]
